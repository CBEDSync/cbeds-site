[build]
  publish = "."
  # No build step — the site is static. Netlify installs the function's
  # dependencies from package.json automatically.
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/cbedsync-data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
